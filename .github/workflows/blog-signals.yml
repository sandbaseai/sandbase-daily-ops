name: Blog search signals

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        default: daily
        type: choice
        options: [daily, hot-topics, gsc, rankings]
      allow_billable_rankings:
        description: Approve billable DataForSEO SERP requests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  hot-topics:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.task == 'daily' || inputs.task == 'hot-topics'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check topic credentials
        id: topic-credentials
        env:
          SANDBASE_API_KEY: ${{ secrets.SANDBASE_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$SANDBASE_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "SANDBASE_API_KEY is required" >&2
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled topic collection: SANDBASE_API_KEY is not configured."
          fi
      - name: Collect topic signals
        if: steps.topic-credentials.outputs.ready == 'true'
        env:
          SANDBASE_API_KEY: ${{ secrets.SANDBASE_API_KEY }}
        run: python3 scripts/daily_hot_topics.py
      - uses: actions/upload-artifact@v4
        if: steps.topic-credentials.outputs.ready == 'true'
        with:
          name: hot-topics-${{ github.run_id }}
          path: outputs/seo-daily-reports/hot-topics-*.json
          if-no-files-found: error

  gsc:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.task == 'daily' || inputs.task == 'gsc'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check GSC credentials
        id: gsc-credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON is required" >&2
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping GSC collection: GOOGLE_SERVICE_ACCOUNT_JSON is not configured."
          fi
      - uses: actions/setup-python@v5
        if: steps.gsc-credentials.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - if: steps.gsc-credentials.outputs.ready == 'true'
        run: pip install google-api-python-client google-auth
      - name: Configure GSC credentials
        if: steps.gsc-credentials.outputs.ready == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          mkdir -p "$RUNNER_TEMP/sandbase"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sandbase/google-service-account.json"
      - name: Collect GSC signals
        if: steps.gsc-credentials.outputs.ready == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/sandbase/google-service-account.json
        run: python3 scripts/seo_daily_check.py
      - uses: actions/upload-artifact@v4
        if: steps.gsc-credentials.outputs.ready == 'true'
        with:
          name: gsc-report-${{ github.run_id }}
          path: outputs/seo-daily-reports/*.md
          if-no-files-found: error

  rankings:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'rankings' && inputs.allow_billable_rankings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Track configured rankings
        env:
          SANDBASE_API_KEY: ${{ secrets.SANDBASE_API_KEY }}
        run: >-
          python3 scripts/track_rankings.py
          --config config/blog-keywords.json
          --allow-billable-requests
          --output outputs/seo-daily-reports/ranking-history.csv
      - uses: actions/upload-artifact@v4
        with:
          name: ranking-history-${{ github.run_id }}
          path: outputs/seo-daily-reports/ranking-history.csv
          if-no-files-found: error
